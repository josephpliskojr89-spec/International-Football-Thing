<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>National Team Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Gentle self-heal: if the app still hasn't painted ~9s after load, do a
      // single plain reload — enough to recover a transient asset hiccup, but it
      // does NOT clear caches or unregister the service worker (that removes the
      // offline fallback and can strand a slow connection on a white screen).
      (function () {
        var ONCE = 'ntm-self-heal';
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return; // app mounted fine
          if (sessionStorage.getItem(ONCE)) return; // only ever once per session
          sessionStorage.setItem(ONCE, '1');
          location.reload();
        }, 9000);
      })();
    </script>
  </body>
</html>
