<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>National Team Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Self-heal guard: if the app hasn't mounted a few seconds after load
      // (e.g. a stale service worker or a half-updated cache served broken
      // assets and the screen is white), unregister SWs, clear caches, and
      // reload exactly once. Prevents the recurring "clear browsing data by
      // hand" dance after deploys.
      (function () {
        var ONCE = 'ntm-self-heal';
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return; // app mounted fine
          if (sessionStorage.getItem(ONCE)) return; // only attempt once per session
          sessionStorage.setItem(ONCE, '1');
          var done = function () { location.reload(); };
          var clearCaches = function () {
            if (window.caches && caches.keys) {
              caches.keys().then(function (keys) {
                Promise.all(keys.map(function (k) { return caches.delete(k); })).then(done, done);
              }, done);
            } else { done(); }
          };
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              Promise.all(regs.map(function (r) { return r.unregister(); })).then(clearCaches, clearCaches);
            }, clearCaches);
          } else { clearCaches(); }
        }, 4000);
      })();
    </script>
  </body>
</html>
