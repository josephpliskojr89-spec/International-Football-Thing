name: Deploy PWA to GitHub Pages

# Builds the Vite app and publishes the dist/ output to GitHub Pages.
# Pages serves the BUILT app — never the repo root (whose index.html is the dev
# entry that loads /src/main.tsx and would show a white screen in production).

on:
  push:
    branches:
      - main
      - claude/ntm-build-plan-yydrhk
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue Pages deployments rather than racing them. cancel-in-progress: false is
# the GitHub-recommended setting — cancelling a run mid-deploy leaves a Pages
# deployment in progress that the next run collides with ("deployment already in
# progress"). Queuing avoids that.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Disable Jekyll processing on Pages (it strips files; not what we want).
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
